configuration:
  marstek_device:
    name: "Marstek Device"
    description: "Connection to the Marstek device and basic MQTT topic settings."
    fields:
      device_ip:
        name: "Device IP"
        description: "IP address of the Marstek device on the local network."
      device_udp_port:
        name: "Device UDP port"
        description: "UDP port configured in the Marstek app under Open API (default 30000)."
      device_ble_mac:
        name: "Bluetooth MAC (auto-detected)"
        description: "Leave empty to auto-detect and remember on first start."
      device_type:
        name: "Device type (auto-detected)"
        description: "Leave empty to auto-detect and remember on first start."
      mqtt_discovery_prefix:
        name: "MQTT discovery prefix"
        description: "Usually leave at the default 'homeassistant'."
      mqtt_base_topic:
        name: "MQTT base topic"
        description: "Topic prefix for all state/command topics of this add-on."
      mqtt_suggested_area:
        name: "Suggested area"
        description: "Home Assistant area suggested for all devices created by this add-on."
  logging_settings:
    name: "Logging"
    description: "Verbosity of the add-on's log output."
    fields:
      log_level:
        name: "Log level"
        description: "'debug' also colorizes control/status/init lines (yellow=control, cyan=status, magenta=init, red=connection) and shows [STATUS]/[CONTROL]/[INIT] tags as a fallback."
      debug_control_logic:
        name: "Debugging - ControlLogic"
        description: "Separate, independently switchable debug log (own color: green) for the passive-mode control loop internals: Shelly input value and the computed power change per cycle. Kept separate from the general log level because it can produce a high volume of log lines on frequent Shelly updates."
  mqtt_port:
    name: "MQTT port (override)"
    description: "Only needed if not using the Mosquitto add-on with service discovery. Leave empty for auto-detection."

  scanrate_statuscalls:
    name: "Scanrate for Statuscalls"
    description: "Poll intervals for the periodic status queries (Bat.GetStatus, ES.GetMode, ES.GetStatus). The first poll of each starts only after the full interval has elapsed since startup."
    fields:
      bat_status_interval_s:
        name: "Battery status interval"
        description: "Seconds between Bat.GetStatus polls."
      es_status_interval_s:
        name: "Energy status interval"
        description: "Seconds between ES.GetStatus polls."
      pv_enabled:
        name: "PV status enabled"
        description: "Enables PV.GetStatus - both during the startup init sequence AND periodic polling. Only Venus D/Venus A support PV.GetStatus per the API docs (Venus C/E do not) - keep disabled for unsupported devices. When disabled, any previously registered PV entities are actively removed from Home Assistant."
      pv_status_interval_s:
        name: "PV status interval"
        description: "Seconds between PV.GetStatus polls (only relevant if PV status is enabled)."
      es_mode_enabled:
        name: "Energy mode polling enabled"
        description: "Turns the periodic ES.GetMode poll on/off. Does NOT affect the one-time ES.GetMode call during the startup init sequence, which always runs."
      es_mode_interval_s:
        name: "Energy mode interval"
        description: "Seconds between ES.GetMode polls."

  passiv_mode_settings:
    name: "Passiv Mode Settings"
    description: "Startup values for the Marstek Passive mode."
    fields:
      power:
        name: "Max discharge/feed-in power"
        description: "Caps the maximum discharge/feed-in power the controller may send, even if it computed more. Charging is not affected - see 'Charging limit' under Selfconsumption Control. 0 is valid and fully disables discharging in Passive mode. Adjustable live via number.passive_default_power, e.g. by a SOC-based automation."
      cd_time:
        name: "Countdown time"
        description: "Countdown (seconds) sent with every Passive command. Adjustable live via number.passive_cd_time."
      max_cd_time:
        name: "Max countdown time"
        description: "Upper bound for the countdown time (device limit: 3600s)."

  selfconsumption_control:
    name: "Selfconsumption Control Parameters for Passive Mode"
    description: "Sluggish filter (dead zone, slew rate, minimum change, hold-off) that turns an external power reading into a calm Passive-mode setpoint, instead of reacting to every spike."
    fields:
      deadzone_w:
        name: "Dead zone"
        description: "Noise suppression around the current setpoint, in Watt."
      min_setpoint_change_w:
        name: "Minimum setpoint change"
        description: "Minimum change vs. the last sent value before sending again."
      max_step_w:
        name: "Maximum step"
        description: "Maximum change per control cycle (slew rate), in Watt."
      min_output_w:
        name: "Charging limit"
        description: "Hard lower bound (negative = charging from the grid). Not affected by the Passive-mode power cap."
      max_output_w:
        name: "Feed-in limit"
        description: "Hard upper bound for feed-in/discharge. The Passive-mode power cap can only tighten this, never exceed it."
      min_send_interval_s:
        name: "Minimum send interval"
        description: "Minimum time between two sent commands, 0-60s (0 = no minimum, send immediately when needed)."
      step_gain:
        name: "Step gain"
        description: "Proportional factor for the step size per cycle: step = clamp(deviation * step_gain, -max_step_w, max_step_w). Default 1.0 reproduces the old fixed step limiter (deviations below max_step_w are applied in full in one cycle). Lower values (e.g. 0.3-0.5) additionally dampen small deviations for a gentler response, while large deviations still converge at up to max_step_w per cycle - no more trade-off between fast large corrections and calm behavior on small noise."
      zero_crossing_hysteresis_w:
        name: "Zero-crossing hysteresis"
        description: "Threshold (W) a new target must exceed beyond zero before a sign change (charge <-> discharge) is allowed. Below the threshold, the target is captured at 0W instead of flipping direction - prevents rapid switching between charging and discharging for loads that hover near zero. Default 0 disables this (immediate sign changes allowed, as before)."
      idle_soc_threshold:
        name: "Idle SOC threshold"
        description: "SOC (%) below which the automatic Passive-mode regulation pauses entirely: no more commands are sent, the device's own cd_time countdown expires naturally, and it falls back to idle. SOC source: whichever of Bat.GetStatus.soc / ES.GetStatus.bat_soc updated most recently. Adjustable live via number.idle_soc_threshold."
      idle_soc_resume_margin:
        name: "Idle SOC resume margin"
        description: "Hysteresis (%): automatic regulation resumes only once SOC reaches idle_soc_threshold + this margin, preventing rapid pause/resume flapping right at the threshold."
      shelly_power_topic:
        name: "External power measurement topic"
        description: "MQTT topic of an external power measurement (e.g. Shelly EM) driving the automatic controller. Leave empty to disable automatic regulation (manual Passive control via Home Assistant still works)."

  message_settings:
    name: "Message Settings"
    description: "Retry behaviour for status/control commands during normal operation (after successful initialization)."
    fields:
      max_retry:
        name: "Max retries"
        description: "Maximum retries before the command is considered failed, 0-10. Whether an exhausted command escalates to Communication Fail/the watchdog is now a separate, independent setting - see escalate_on_failure below."
      escalate_on_failure:
        name: "Escalate on failure"
        description: "Whether a command that still fails after all retry attempts triggers Communication Fail and the watchdog. Independent of max_retry: set to false to combine robustness (multiple retries) with no escalation, e.g. for a flaky connection where isolated failures shouldn't force a restart. Default true matches the original behavior. Does not affect the startup init sequence, which always escalates."
      timeout_s:
        name: "Timeout"
        description: "Timeout per attempt, in seconds."
      min_inter_message_delay_s:
        name: "Minimum delay between messages"
        description: "Minimum time between two SENT messages of any kind (0-30s, 0 = disabled). Control commands (mode changes, DOD, LED, Bluetooth) always bypass this delay and are sent immediately - it only paces status polls."
        description: "Timeout per attempt, in seconds."

  init_settings:
    name: "Init Settings"
    description: "Retry/backoff behaviour during the initial startup sequence (device discovery, first status reads, startup commands)."
    fields:
      base_timeout_s:
        name: "Base timeout"
        description: "Timeout of the first attempt during initialization."
      timeout_increment_s:
        name: "Timeout increment"
        description: "Added to the timeout on each further attempt."
      max_retries:
        name: "Max retries"
        description: "Maximum retries during the init sequence."
      inter_command_delay_s:
        name: "Delay between init commands"
        description: "Pause between the individual startup commands (Marstek.GetDevice, Wifi.GetStatus, ..., Led.Ctrl), so the device isn't hit with many requests at once. Independent of message_settings.min_inter_message_delay_s, which does not apply during initialization."

  dod_settings:
    name: "DOD (Depth of Discharge)"
    description: "Depth-of-discharge value applied on every add-on start."
    fields:
      startup_value:
        name: "DOD startup value"
        description: "Value (30-88) set on the device at every add-on start."

  additional_settings:
    name: "Additional Settings"
    description: "Miscellaneous startup values."
    fields:
      led_startup_state:
        name: "LED startup state"
        description: "Panel LED at startup: 0 = off, 1 = on."
      ble_block_startup_enable:
        name: "Bluetooth advertising startup state"
        description: "Bluetooth advertising at startup: 0 = active, 1 = disabled."

  mqtt_settings:
    name: "MQTT Settings"
    description: "Override the MQTT broker connection. Only needed if not using the Mosquitto add-on with service discovery - leave empty otherwise."
    fields:
      mqtt_host:
        name: "MQTT host"
        description: "Only needed if not using the Mosquitto add-on with service discovery."
      mqtt_username:
        name: "MQTT username"
        description: "Only needed if not using the Mosquitto add-on with service discovery."
      mqtt_password:
        name: "MQTT password"
        description: "Only needed if not using the Mosquitto add-on with service discovery."
