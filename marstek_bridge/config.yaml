name: "Marstek MQTT Bridge"
version: "0.3.0"
slug: "marstek_bridge"
description: >-
  Bruecke zwischen einem Marstek Energiespeicher (lokale UDP-API) und Home
  Assistant per MQTT-Discovery, inkl. traegem Self-Consumption-Regler fuer
  den Passive-Mode.
url: "https://github.com/maxortb-prog/Marstek-MQTT-Bridge"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
services:
  - "mqtt:want"
map:
  - "addon_config:rw"
options:
  marstek_device:
    device_ip: "192.168.0.45"
    device_udp_port: 30000
    device_ble_mac: ""
    device_type: ""
    mqtt_discovery_prefix: "homeassistant"
    mqtt_base_topic: "Marstek-Bridge-Control"
    mqtt_suggested_area: "Marstek"

  scanrate_statuscalls:
    bat_status_interval_s: 60
    es_status_interval_s: 300
    pv_enabled: false
    pv_status_interval_s: 300
    es_mode_enabled: true
    es_mode_interval_s: 900

  passiv_mode_settings:
    power: 800
    cd_time: 180
    max_cd_time: 300

  selfconsumption_control:
    deadzone_w: 5
    min_setpoint_change_w: 15
    max_step_w: 100
    min_output_w: -1500
    max_output_w: 800
    min_send_interval_s: 2
    idle_soc_threshold: 5.0
    idle_soc_resume_margin: 3.0
    shelly_power_topic: ""
    shelly_debounce_time_s: 2.0

  message_settings:
    max_retry: 3
    timeout_s: 1.0
    min_inter_message_delay_s: 10.0

  init_settings:
    base_timeout_s: 2.0
    timeout_increment_s: 2.0
    max_retries: 4
    inter_command_delay_s: 2.0

  dod_settings:
    startup_value: 85

  additional_settings:
    led_startup_state: 0
    ble_block_startup_enable: 1

  mqtt_settings:
    mqtt_host: ""
    mqtt_username: ""
    mqtt_password: ""

  logging_settings:
    log_level: "info"
    debug_control_logic: false
schema:
  marstek_device:
    device_ip: "str"
    device_udp_port: "port"
    device_ble_mac: "str?"
    device_type: "str?"
    mqtt_discovery_prefix: "str"
    mqtt_base_topic: "str"
    mqtt_suggested_area: "str"

  scanrate_statuscalls:
    bat_status_interval_s: "int(60,86400)"
    es_status_interval_s: "int(10,86400)"
    pv_enabled: "bool"
    pv_status_interval_s: "int(10,86400)"
    es_mode_enabled: "bool"
    es_mode_interval_s: "int(60,86400)"

  passiv_mode_settings:
    power: "int(0,1500)"
    cd_time: "int(1,3600)"
    max_cd_time: "int(1,3600)"

  selfconsumption_control:
    deadzone_w: "int(0,500)"
    min_setpoint_change_w: "int(0,500)"
    max_step_w: "int(1,1000)"
    min_output_w: "int(-1500,0)"
    max_output_w: "int(0,1500)"
    min_send_interval_s: "int(0,60)"
    idle_soc_threshold: "float(0,100)"
    idle_soc_resume_margin: "float(0,100)"
    shelly_power_topic: "str?"
    shelly_debounce_time_s: "float(0,300)"

  message_settings:
    max_retry: "int(0,10)"
    timeout_s: "float(0.1,10)"
    min_inter_message_delay_s: "float(0,30)"

  init_settings:
    base_timeout_s: "float(0.1,30)"
    timeout_increment_s: "float(0,30)"
    max_retries: "int(0,10)"
    inter_command_delay_s: "float(0,30)"

  dod_settings:
    startup_value: "int(30,88)"

  additional_settings:
    led_startup_state: "list(0|1)"
    ble_block_startup_enable: "list(0|1)"

  mqtt_settings:
    mqtt_host: "str?"
    mqtt_username: "str?"
    mqtt_password: "password?"

  # mqtt_port bleibt bewusst OHNE Default (schema-only optional): ein
  # gueltiger Port-Default wuerde die "leer lassen = automatische Erkennung
  # via Mosquitto-Service-Discovery"-Logik in addon_options.py verhindern.
  mqtt_port: "port?"

  logging_settings:
    log_level: "list(debug|info|warning|error)"
    debug_control_logic: "bool"
