name: "Marstek MQTT Bridge"
version: "0.0.2"
slug: "marstek_bridge"
description: >-
  Bruecke zwischen einem Marstek Energiespeicher (lokale UDP-API) und Home
  Assistant per MQTT-Discovery, inkl. traegem Self-Consumption-Regler fuer
  den Passive-Mode.
url: "https://github.com/maxortb-prog/Marstek-MQTT-Bridge"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
services:
  - "mqtt:want"
map:
  - "addon_config:rw"
options:
  # ── Allgemein / Verbindung ──────────────────────────────────────────
  device_ip: "192.168.0.45"
  device_udp_port: 30000
  device_ble_mac: ""
  device_type: ""
  mqtt_discovery_prefix: "homeassistant"
  mqtt_base_topic: "Marstek-Bridge-Control"
  mqtt_suggested_area: "Marstek"
  log_level: "info"

  # ── Abtastrate fuer Status-Abfragen ──────────────────────────────────
  bat_status_interval_s: 3600
  es_mode_interval_s: 900
  es_status_interval_s: 300

  # ── Passive-Mode Einstellungen ───────────────────────────────────────
  # passive_power: deckelt die maximale EINSPEISE-/Entladeleistung, die der
  # Regler an den Marstek senden darf - selbst wenn der Regler rechnerisch
  # mehr ermitteln wuerde, wird auf diesen Wert begrenzt. Zur Laufzeit ueber
  # HA (number.passive_default_power) aenderbar, z.B. SOC-abhaengig.
  # Betrifft NUR die Einspeise-/Entladerichtung: die Ladeleistung wird davon
  # unberuehrt weiterhin ausschliesslich durch controller_min_output_w
  # (-1500) begrenzt.
  passive_power: 800
  passive_cd_time: 60
  passive_max_cd_time: 3600

  # ── Regelungsparameter (Passive-Mode Controller) ─────────────────────
  controller_deadzone_w: 40
  controller_min_setpoint_change_w: 50
  controller_max_step_w: 125
  controller_min_output_w: -1500
  controller_max_output_w: 800
  controller_min_send_interval_s: 30
  shelly_power_topic: ""

  # ── Message Settings (laufender Poll-/Control-Betrieb) ───────────────
  message_settings_max_retry: 3
  message_settings_timeout_s: 1.0

  # ── Initphase Settings ────────────────────────────────────────────────
  init_base_timeout_s: 2.0
  init_timeout_increment_s: 10.0
  init_max_retries: 4
  init_inter_command_delay_s: 10.0

  # ── DOD Setting (Depth of Discharge) ─────────────────────────────────
  dod_startup_value: 88

  # ── Sonstige Startwerte ────────────────────────────────────────────────
  led_startup_state: 0
  ble_block_startup_enable: 0
schema:
  device_ip: "str"
  device_udp_port: "port"
  device_ble_mac: "str?"
  device_type: "str?"
  mqtt_discovery_prefix: "str"
  mqtt_base_topic: "str"
  mqtt_suggested_area: "str"
  log_level: "list(debug|info|warning|error)"

  bat_status_interval_s: "int(60,86400)"
  es_mode_interval_s: "int(60,86400)"
  es_status_interval_s: "int(10,86400)"

  # passive_power: deckelt die max. Einspeise-/Entladeleistung des Reglers,
  # selbst wenn rechnerisch mehr ermittelt wuerde. Laderichtung bleibt davon
  # unberuehrt (siehe controller_min_output_w).
  passive_power: "int(0,1500)"
  passive_cd_time: "int(1,3600)"
  passive_max_cd_time: "int(1,3600)"

  controller_deadzone_w: "int(0,500)"
  controller_min_setpoint_change_w: "int(0,500)"
  controller_max_step_w: "int(1,1000)"
  controller_min_output_w: "int(-1500,0)"
  controller_max_output_w: "int(0,1500)"
  controller_min_send_interval_s: "int(0,60)"
  shelly_power_topic: "str?"

  message_settings_max_retry: "int(0,10)"
  message_settings_timeout_s: "float(0.1,10)"

  init_base_timeout_s: "float(0.1,30)"
  init_timeout_increment_s: "float(0,30)"
  init_max_retries: "int(0,10)"
  init_inter_command_delay_s: "float(0,30)"

  dod_startup_value: "int(30,88)"
  led_startup_state: "list(0|1)"
  ble_block_startup_enable: "list(0|1)"

  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
